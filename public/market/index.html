<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TextileERP — Bozor</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/market.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">👔</div>
      <div>
        <div class="logo-text">TextileERP</div>
        <div class="logo-sub">Bozor</div>
      </div>
    </div>
    <input id="search-input" class="search-input" type="text" placeholder="🔍  Mahsulot qidirish..." oninput="renderProducts()">
    <button class="cart-btn" onclick="openCart()">
      🛒 Savat
      <span class="cart-count" id="cart-count" style="display:none;">0</span>
    </button>
  </div>
</header>

<!-- CATEGORY FILTERS -->
<div class="category-bar">
  <div class="category-bar-inner" id="category-filters"></div>
</div>

<!-- PRODUCTS -->
<main class="main">
  <div class="section-header">
    <div class="section-title">Mahsulotlar</div>
    <div class="product-count" id="product-count"></div>
  </div>
  <div class="products-grid" id="products-grid">
    <div class="no-products">Yuklanmoqda...</div>
  </div>
</main>

<!-- CART OVERLAY -->
<div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>

<!-- CART SIDEBAR -->
<div class="cart-sidebar" id="cart-sidebar">
  <div class="cart-header">
    <div>
      <div class="cart-title">🛒 Savat</div>
      <div class="cart-subtitle"><span id="cart-items-count">0</span> ta mahsulot</div>
    </div>
    <button class="close-btn" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items" id="cart-items">
    <div class="cart-empty">
      <div style="font-size:40px;margin-bottom:10px;">🛒</div>
      <div>Savat bo'sh</div>
    </div>
  </div>
  <div class="cart-footer">
    <div class="cart-total-row">
      <span style="color:var(--muted);">Jami to'lov:</span>
      <strong id="cart-total">0 UZS</strong>
    </div>
    <button class="checkout-btn" onclick="openCheckout()">Buyurtma berish →</button>
  </div>
</div>

<!-- CHECKOUT MODAL -->
<div class="modal-overlay" id="checkout-modal">
  <div class="modal">
    <div class="modal-title">📦 Buyurtma Berish</div>
    <div class="form-group">
      <label class="form-label">Ism Familiya *</label>
      <input class="form-input" id="checkout-name" placeholder="Ism Familiya">
    </div>
    <div class="form-group">
      <label class="form-label">Telefon *</label>
      <input class="form-input" id="checkout-phone" placeholder="+998 90 123 45 67" type="tel">
    </div>
    <div class="form-group">
      <label class="form-label">Manzil / Shahar</label>
      <input class="form-input" id="checkout-address" placeholder="Toshkent, Chilonzor tumani">
    </div>
    <div class="form-group">
      <label class="form-label">Izoh (ixtiyoriy)</label>
      <textarea class="form-input" id="checkout-note" placeholder="Qo'shimcha talab yoki izoh..." rows="2" style="resize:none;"></textarea>
    </div>
    <div id="checkout-summary" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:4px;font-size:13px;color:var(--muted);"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeCheckout()">Bekor</button>
      <button class="btn btn-primary" onclick="submitOrder()">Tasdiqlash ✓</button>
    </div>
  </div>
</div>

<!-- SUCCESS MODAL -->
<div class="modal-overlay" id="success-modal">
  <div class="modal">
    <div class="success-icon">✅</div>
    <div class="success-title">Buyurtma qabul qilindi!</div>
    <div class="success-sub">
      Rahmat, <strong id="success-name"></strong>!<br>
      Tez orada siz bilan bog'lanamiz.
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="closeSuccess()">Davom etish</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/market.js"></script>
</body>
</html>
